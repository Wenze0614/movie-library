# Builds the desktop app for Mac and Windows when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0) and attaches the installers to a
# GitHub release. The intro page links to the latest release's files by name.
name: Release desktop app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app compares its package.json version with the release tag, so a
      # forgotten bump would offer this release as an update forever.
      - name: Tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Movie-Library-*.dmg
            dist/Movie-Library-*.zip
            dist/Movie-Library-*.exe
